,support:null,topDomainsLabel:`Áreas com maior atividade no mês`,provenance:`Documentação oficial da Databricks · pesquisa de 01/10/2026`},y=[{id:`destaques`,n:`01`,label:`Destaques do mês`,nav:`Destaques`},{id:`impacto`,n:`02`,label:`O que muda na prática`,nav:`Impacto`},{id:`acoes`,n:`03`,label:`Requer ação`,nav:`Ações`},{id:`panorama`,n:`04`,label:`Panorama dos lançamentos`,nav:`Panorama`},{id:`dominios`,n:`05`,label:`Atualizações por domínio`,nav:`Domínios`},{id:`modelos`,n:`06`,label:`Modelos`,nav:`Modelos`},{id:`indice`,n:`07`,label:`Índice completo`,nav:`Índice`}],b=e=>{let t=y.find(t=>t.id===e);return`${t.n} — ${t.label.toUpperCase()}`},ee=[{id:`mcp`,stage:`GA`,date:`25/09/2026`,title:`Genie One MCP server`,lede:`O Genie passa a atender qualquer agente compatível com MCP.`,why:`Agentes de terceiros respondem perguntas de negócio com o mesmo contexto governado do Genie, com as permissões do Unity Catalog aplicadas a cada requisição.`,decisive:`Endpoint Beta encerra em 31/10/2026`,clouds:`AWS · Azure · GCP`,details:{tech:`MCP Service gerenciado no Unity Gateway (system.ai.genie_one_mcp) que expõe o Genie como ferramenta conversacional via Model Context Protocol para clientes como Claude, ChatGPT e Cursor. Em clientes compatíveis com MCP Apps, retorna uma visualização interativa.`,prereq:[`Usuários de conta têm EXECUTE em system.ai por padrão; em geral, não é preciso grant adicional.`],restrictions:[`Permissões do Unity Catalog são aplicadas a cada requisição: usuários e agentes só consultam dados a que têm acesso.`,`O endpoint Beta /api/2.0/mcp/genie está depreciado e será desligado em 31/10/2026.`],sources:[[`Release note · 25/09/2026`,g(`Genie One MCP server`).src],[`Documentação`,`https://docs.databricks.com/aws/en/agents/mcp-tools/genie-mcp`]]}},{id:`gateway`,stage:`GA`,date:`16/09/2026`,title:`Unity Gateway API e developer tools`,lede:`Modelos, provedores e MCP services como infraestrutura versionada.`,why:`O acesso a IA, inclusive o de desenvolvedores, passa a ser governado com o mesmo rigor de pipelines e permissões.`,decisive:`Requer versões mínimas de Terraform, CLI e SDKs`,clouds:`AWS · Azure · GCP`,details:{tech:`API para criar, ler, atualizar, listar e excluir model services, model provider services e MCP services, com suporte nas ferramentas de desenvolvedor da Databricks. No mesmo mês: CLI ug para coding agents e configuração central de coding agents.`,prereq:[`Terraform provider 1.132.0+ · Databricks CLI v1.17.0+`,`databricks-sdk (Python) 0.136.0+ · Go v0.178.0+ · Java 0.153.0+ · @databricks/sdk-aigateway 0.19.0+`],restrictions:[`Suporte em Declarative Automation Bundles está em Beta.`,`CLI ug e configuração central de coding agents: estágio não divulgado na fonte.`],sources:[[`Release note · 16/09/2026`,g(`Unity Gateway API`).src],[`CLI ug · 22/09/2026`,g(`Connect coding agents`).src]]}},{id:`abac`,stage:`Beta`,date:`08–29/09/2026`,title:`ABAC para metastore, views, DENY e time travel`,lede:`Uma política, aplicada a todo o metastore.`,why:`A proteção de dados sensíveis deixa de depender de regras replicadas por catálogo, e DENY garante segregação de funções até sobre donos de objetos.`,decisive:`Beta · requer Databricks Runtime 19+`,clouds:`AWS · Azure · GCP`,details:{tech:`Row filters, column masks, GRANT e DENY no nível do metastore valem para todos os catálogos, inclusive os futuros. ABAC passa a cobrir views e consultas de time travel em tabelas gerenciadas qualificadas; DENY nega MANAGE ACCESS CONTROL, inclusive a owners, e prevalece sobre qualquer grant.`,prereq:[`Databricks Runtime 19+ para políticas de metastore via SQL, ABAC em views e time travel com ABAC.`,`Papel de metastore admin para criar, alterar ou excluir políticas no metastore.`,`ABAC on Views habilitado por account admin na página Previews.`],restrictions:[`As quatro capacidades estão em Beta.`,`Políticas de metastore não são replicadas pelo disaster recovery gerenciado do Unity Catalog.`],sources:[[`ABAC DENY · 08/09/2026`,g(`ABAC DENY policies`).src],[`Metastore · 17/09/2026`,g(`Metastore-level ABAC`).src],[`Time travel · 23/09/2026`,g(`Time travel queries`).src],[`Views · 29/09/2026`,g(`ABAC on views`).src]]}},{id:`sharing`,stage:`GA`,date:`11–24/09/2026`,title:`OpenSharing para dados federados e metric views`,lede:`Compartilhar sem copiar.`,why:`Parceiros, subsidiárias e clientes recebem dados e métricas consistentes sem pipelines de cópia.`,decisive:`Esquemas estrangeiros geram custo de compute e storage no provedor`,clouds:`AWS · Azure · GCP`,details:{tech:`GA para compartilhar tabelas Delta federadas (OneLake, Hive metastore, AWS Glue), tabelas Iceberg federadas, inclusive para clientes Iceberg externos, e esquemas e tabelas estrangeiros via Lakehouse Federation. Metric views foram de Beta (03/09) a GA (24/09).`,prereq:[`Metric views compartilhadas são lidas com MEASURE(...) em compute serverless.`],restrictions:[`Esquemas e tabelas estrangeiros materializam dados no lado do provedor, com custo de compute e storage.`],sources:[[`Foreign Iceberg · 11/09/2026`,g(`Sharing foreign Iceberg`).src],[`Foreign schemas · 11/09/2026`,g(`Sharing foreign schemas`).src],[`Foreign Delta · 15/09/2026`,g(`Sharing foreign Delta`).src],[`Metric views · 24/09/2026`,g(`Share metric views`).src]]}},{id:`memory`,stage:`Beta`,date:`16/09/2026`,title:`Managed agent memory e sessions`,lede:`Estado gerenciado para agentes de qualquer framework.`,why:`Agentes com memória chegam à produção sem que o time construa e opere um banco próprio para isso.`,decisive:`Beta · na prévia, cobra-se a instância Lakebase`,clouds:`AWS · Azure · GCP (no GCP, publicado em 30/09)`,details:{tech:`Dois stores gerenciados sobre Lakebase: memória de longo prazo com busca semântica e histórico durável de sessões, utilizáveis por agentes de qualquer framework. A Agent Bricks CLI (Beta) faz o scaffold (LangGraph ou OpenAI Agents SDK), a execução local e o deploy no agent runtime.`,prereq:[`Python 3.10+ para o AgentKit SDK.`,`A Agent Bricks CLI não exige configuração no workspace.`],restrictions:[`Beta. Na prévia, cobra-se a instância Lakebase subjacente; o preço pode mudar.`,`Controle de acesso no nível do store; não há controle por entrada nem por ator.`],sources:[[`Release note · 16/09/2026`,g(`Managed agent memory`).src],[`Agent Bricks CLI · 29/09/2026`,g(`Agent Bricks CLI`).src],[`Documentação`,`https://docs.databricks.com/aws/en/agents/agent-memory/managed-memory`]]}}],te={engenharia:{item:`Automatic change data feed`,line:`Mudanças calculadas na consulta, sem configurar change data feed tabela a tabela.`,note:`Também: 10 conectores em Beta, 8 deles para logs de auditoria e segurança`},ia:{item:`ai_decide`,line:`Decisões estruturadas em SQL ou REST, sem recorrer a um LLM generativo.`,note:`Também: 9 modelos novos no Unity Gateway e 3 retiradas em 30/10`},governanca:{item:`Tags for dashboards`,line:`Tags governadas em dashboards, notebooks, apps e Genie Agents.`,note:`ABAC e OpenSharing estão entre os lançamentos principais`},genie:{item:`Databricks Excel Add-in`,line:`Excel conectado ao Unity Catalog, com SQL, pivot tables ao vivo e writeback.`,note:`Também em GA: Genie Code scheduled tasks`},gateway:{item:`Connect coding agents`,line:`Claude Code, Codex e outros sob a mesma governança, com tracing e gasto visíveis.`,note:`Unity Gateway API está entre os lançamentos principais`},plataforma:{item:`Horizontal scaling for Databricks Apps`,line:`Apps em múltiplas instâncias atrás de uma URL, com deploy sem downtime.`,note:`Também em GA: Lakebase Search e Apps telemetry`},sql:{item:`Query history system table`,line:`Histórico de queries em nível de conta, com query tags também em GA.`,note:`Base oficial para FinOps de SQL`},seguranca:{item:`HITRUST and IRAP`,line:`Controles via compliance security profile, agora exigido para HIPAA, HITRUST e IRAP.`,note:`Restrito à Azure`}},ne={index:`04 — O QUE MUDA NA PRÁTICA`,title:`O que muda para arquitetura e operação`,kicker:`Impactos concretos dos releases deste es de adotar environment version 6`,affected:`Código que usa dbutils via gateway Py4J ou lê /databricks/runtime/info.json.`,action:`Validar notebooks e jobs no environment version 6 antes de migrar, porque essas APIs foram desativadas ou removidas.`,owner:`Engenharia de dados`,sources:[[`Notas da versão`,`https://docs.databricks.com/aws/en/release-notes/serverless/environment-version/six`]]}],ie=[`GA`,`Public Preview`,`Beta`,`Não informado`,`N/A`],S={GA:`GA`,"Public Preview":`Public Preview`,Beta:`Beta`,"Não informado":`Não divulgado`,"N/A":`Outro evento`},ae=e=>g(e),oe=`<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">

Complemento do Databricks Release Intelligence de setembro de 2026. Cada linha é uma **funcionalidade ou mudança** (não um anúncio), deduplicada entre clouds e entre fontes (release notes, blog e newsroom).

|---|---|
| Atualizações de produto verificadas (deduplicadas) | **95** |

## Legenda

- **Estágio**: registrado como anunciado em setembro, com a nomenclatura oficial (GA, Public Preview, Beta). **Estágio não divulgado** = a fonte não informa a maturidade. **Outro evento** = o conceito de estágio não se aplica (retirada, mudança de comportamento, manutenção).
- **Tipo**: Lançamento · Transição (mudança de estágio no mês) · Descontinuação · Mudança (de comportamento ou padrão, normalmente exige ação) · Manutenção (versões e patches).
- **Data**: data da entrada nas release notes (ou de publicação no blog, quando o item só aparece lá). Releases são escalonados; a conta pode receber a mudança uma semana ou mais depois.
- **Cloud**: presença da entrada nas release notes de cada cloud. A ausência na página de uma cloud não prova indisponibilidade; restrições regionais foram verificadas na documentação apenas para os destaques.
- **Fonte**: links para a entrada específica (âncora) da release note AWS; itens exclusivos de Azure/GCP apontam para a página da respectiva cloud.

## Notas de cobertura e incertezas

- **Fontes consultadas** (acesso direto em 01/10/2026): release notes da plataforma de setembro/2026 para [AWS](https://docs.databricks.com/aws/en/release-notes/product/2026/september), [Azure](https://learn.microsoft.com/en-us/azure/databricks/release-notes/product/2026/september) e [GCP](https://docs.databricks.com/gcp/en/release-notes/product/2026/september); [Databricks SQL](https://docs.databricks.com/aws/en/sql/release-notes/2026#september-2026); [Databricks Runtime](https://docs.databricks.com/aws/en/release-notes/runtime/); [serverless](https://docs.databricks.com/aws/en/release-notes/serverless/); [Lakeflow pipelines](https://docs.databricks.com/aws/en/release-notes/dlt/2026); todos os posts do [blog](https://www.databricks.com/blog) publicados no mês (via sitemap oficial) e todos os press releases do [newsroom](https://www.databricks.com/company/newsroom).
- **Databricks Runtime**: nenhuma versão nova em setembro (DBR 19 foi lançado em 15/06/2026); apenas atualizações de manutenção de 01/09. **Serverless**: a página de release notes não tem entradas de setembro (a última é de 06/08); environment version 6 foi registrado nas release notes da plataforma.
- **Estágio não divulgado** (29 itens): a fonte não informa a maturidade, inclusive em 9 disponibilizações de modelos no Unity Gateway. Não foi inferido estágio a partir de outras páginas, exceto nas notas dos destaques, sempre identificadas.
- **Itens só no blog** (contados): Lakebase Search (GA em AWS/Azure segundo o post de 28/09), \`ai_decide\` (Beta, 30/09), on-demand state repartitioning (Public Preview, 14/09) e as novidades de Genie Agents (02/09, estágio não informado no post). Para esses itens, a data é a de publicação do post.
- **Diferenças de data entre clouds**: Agent Bricks CLI e managed agent memory/sessions aparecem em 30/09 no GCP; maintenance windows aparece em 15/09 na Azure. O inventário usa a data AWS.
- **Benefícios quantitativos**: só foram mantidos quando declarados pela Databricks (ex.: ~15% em MERGE/UPDATE com Auto CDF) e aparecem atribuídos. Benchmarks de blog (ex.: Lakebase Search, IP functions) não foram replicados no one-page.
- **Fora do escopo verificado**: release notes específicas de SDKs, Terraform, CLI, extensões de IDE, Marketplace e conectores de parceiros; anúncios regionais não publicados no newsroom global.
- **Metadado das páginas**: o cabeçalho “Last updated” das release notes AWS/GCP mostra 11/09/2026, embora listem entradas até 30/09; a página da Azure indica atualização em 30/09/2026. As entradas e datas por item foram usadas como referência.
